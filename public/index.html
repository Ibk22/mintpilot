<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MintPilot — Live Dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #0b0e14; color: #e6e9ef; }
  header { padding: 28px 24px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0; font-size: 28px; letter-spacing: .3px; }
  h1 .pilot { color: #f0b90b; }
  .sub { color: #8b93a5; margin-top: 6px; font-size: 14px; }
  .totals { display: flex; flex-wrap: wrap; gap: 14px; max-width: 1100px;
            margin: 18px auto 4px; padding: 0 24px; }
  .stat { background: #131826; border: 1px solid #232a3d; border-radius: 12px;
          padding: 14px 18px; min-width: 170px; flex: 1; }
  .stat .label { color: #8b93a5; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .stat .value { font-size: 24px; font-weight: 650; margin-top: 4px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 24px 40px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 14px; }
  .bar .updated { color: #8b93a5; font-size: 13px; }
  button { background: #f0b90b; color: #111; border: 0; border-radius: 8px;
           padding: 8px 14px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card { background: #131826; border: 1px solid #232a3d; border-radius: 12px; padding: 16px; }
  .card h2 { margin: 0 0 2px; font-size: 16px; }
  .card .sym { color: #f0b90b; font-size: 12px; font-weight: 700; letter-spacing: .06em; }
  .card .addr { color: #8b93a5; font-size: 12px; font-family: ui-monospace, monospace; margin: 6px 0 12px; }
  .card .addr a { color: #8b93a5; text-decoration: none; }
  .card .addr a:hover { color: #f0b90b; }
  .row { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .row .k { color: #8b93a5; }
  .row .v { font-weight: 600; }
  .err { color: #e5534b; font-size: 12px; margin-top: 8px; }
  .empty { color: #8b93a5; padding: 30px 0; }
</style>
</head>
<body>
<header>
  <h1>Mint<span class="pilot">Pilot</span></h1>
  <div class="sub">Live dashboard — every number read from BNB Chain at load. Read-only; nothing is signed or sent.</div>
</header>

<section class="totals">
  <div class="stat"><div class="label">Collections</div><div class="value" id="t-collections">—</div></div>
  <div class="stat"><div class="label">Total minted</div><div class="value" id="t-minted">—</div></div>
  <div class="stat"><div class="label">Waiting in contracts</div><div class="value" id="t-balance">—</div></div>
  <div class="stat"><div class="label">BNB price</div><div class="value" id="t-price">—</div></div>
</section>

<main>
  <div class="bar">
    <div class="updated" id="updated">Loading live data…</div>
    <button id="refresh">Refresh</button>
  </div>
  <div class="grid" id="grid"><div class="empty">Reading the chain…</div></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const short = (a) => a.slice(0, 6) + '…' + a.slice(-4);
const fmt = (n) => n === null || n === undefined ? '—' : n.toLocaleString('en-US');
const fmtBnb = (n) => n === null || n === undefined ? '—' : n.toFixed(6) + ' BNB';

async function load() {
  const btn = $('refresh');
  btn.disabled = true;
  try {
    const res = await fetch('/api/collections');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    $('t-collections').textContent = fmt(data.totals.collections);
    $('t-minted').textContent = fmt(data.totals.minted);
    $('t-balance').textContent = fmtBnb(data.totals.balanceBnb) +
      (data.totals.balanceUsd !== null && data.totals.balanceUsd !== undefined
        ? '  (≈ $' + data.totals.balanceUsd.toFixed(2) + ')' : '');
    $('t-price').textContent = data.bnbUsd ? '$' + data.bnbUsd.toLocaleString('en-US', { maximumFractionDigits: 2 }) : '—';
    $('updated').textContent = 'Updated ' + new Date(data.updatedAt).toLocaleTimeString() + ' · auto-refreshes every 60s';
    $('grid').innerHTML = data.collections.map((c) => `
      <div class="card">
        <h2>${escapeHtml(c.name)}</h2>
        <div class="sym">${escapeHtml(c.symbol || '')}</div>
        <div class="addr" title="${c.address}">
          <a href="https://bscscan.com/address/${c.address}" target="_blank" rel="noopener">${short(c.address)}</a>
        </div>
        <div class="row"><span class="k">Minted</span><span class="v">${fmt(c.minted)}</span></div>
        <div class="row"><span class="k">Balance</span><span class="v">${fmtBnb(c.balanceBnb)}</span></div>
        ${c.ok ? '' : '<div class="err">Live read failed for this contract — showing what we have.</div>'}
      </div>`).join('');
  } catch (e) {
    $('updated').textContent = 'Could not load live data: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
$('refresh').addEventListener('click', load);
load();
setInterval(load, 60000);
</script>
</body>
</html>
